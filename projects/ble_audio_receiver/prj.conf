# --- Bluetooth General Settings ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AuraLink"
CONFIG_BT_EXT_ADV=y
CONFIG_BT_MAX_CONN=1

# --- Security, Multi-Device Bonding & Persistence Across Reboots ---
CONFIG_BT_SMP=y
CONFIG_BT_SIGNING=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT_SETTINGS=y

# --- Logging Subsystem ---
CONFIG_LOG=y

# --- Core Audio & LC3 Codec Features ---
CONFIG_BT_AUDIO=y
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_FPU=y
CONFIG_LIBLC3=y

# --- BAP Unicast Server & Volume Control Renderer ---
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=2
CONFIG_BT_VCP_VOL_REND=y

# --- Official Phone-Assisted Auracast Sink (BASS Scan Delegator + PAST + Sink) ---
CONFIG_BT_OBSERVER=y
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_PER_ADV_SYNC_TRANSFER_RECEIVER=y
CONFIG_BT_ISO_SYNC_RECEIVER=y
CONFIG_BT_BAP_SCAN_DELEGATOR=y
CONFIG_BT_BAP_SCAN_DELEGATOR_RECV_STATE_COUNT=2
CONFIG_BT_BAP_BASS_MAX_SUBGROUPS=2
CONFIG_BT_BAP_BROADCAST_SINK=y
CONFIG_BT_BAP_BROADCAST_SNK_SUBGROUP_COUNT=2
CONFIG_BT_BAP_BROADCAST_SNK_STREAM_COUNT=2

# --- Buffer Tuning for High-Throughput HCI Channels ---
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255

# --- Compatibility Layer for Android / Samsung / Pixel Source Stacks ---
CONFIG_BT_CAP_ACCEPTOR=y
CONFIG_BT_ISO_RX_BUF_COUNT=16
CONFIG_BT_ISO_TX_BUF_COUNT=2
CONFIG_BT_ISO_RX_MTU=251
CONFIG_BT_ISO_MAX_CHAN=4
CONFIG_BT_AUDIO_CODEC_CFG_MAX_DATA_SIZE=32
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=255
CONFIG_BT_ATT_PREPARE_COUNT=32

# --- Thread & Workqueue Stack Allocations (Prevents BASE / BASS Stack Overflow) ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=8192

# --- Timing Constraints Optimization ---
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=50
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=70
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Dynamic DB unlocks ASCS, VCS & BASS
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_CACHING=y
CONFIG_BT_GATT_SERVICE_CHANGED=y

# --- I2S Driver Subsystem ---
CONFIG_I2S=y
CONFIG_I2S_NRFX=y
CONFIG_I2S_NRFX_TX_BLOCK_COUNT=24

CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y