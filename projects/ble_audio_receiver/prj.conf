# --- Bluetooth General Settings ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="LE-Audio Receiver"
CONFIG_BT_EXT_ADV=y
CONFIG_BT_SMP=y
CONFIG_BT_SIGNING=y

# --- Logging Subsystem ---
CONFIG_LOG=y

# --- Core Audio & LC3 Codec Features ---
CONFIG_BT_AUDIO=y
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_FPU=y
CONFIG_LIBLC3=y

# --- BAP Unicast Server Configuration ---
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=2
CONFIG_BT_VCP_VOL_REND=y

# --- Buffer Tuning for High-Throughput HCI Channels ---
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255

# --- Compatibility Layer for Android / Samsung Source Stacks ---
CONFIG_BT_CAP_ACCEPTOR=y
CONFIG_BT_ISO_RX_BUF_COUNT=4
CONFIG_BT_ISO_TX_BUF_COUNT=2
CONFIG_BT_ISO_RX_MTU=251
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=32
CONFIG_BT_ATT_PREPARE_COUNT=1

# --- Thread Stack Allocations ---
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

# --- Timing Constraints Optimization ---
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# --- Auracast Broadcast Sink Subsystem ---
CONFIG_BT_OBSERVER=y
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_ISO_SYNC_RECEIVER=y

# CRITICAL SPEC DEPENDENCY: Dynamic DB unlocks the Scan Delegator
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_BAP_SCAN_DELEGATOR=y

# Core Auracast Target Allocations
CONFIG_BT_BAP_BROADCAST_SINK=y
CONFIG_BT_BAP_BROADCAST_SNK_COUNT=1
CONFIG_BT_BAP_BROADCAST_SNK_STREAM_COUNT=2
CONFIG_BT_ISO_MAX_CHAN=6

CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400